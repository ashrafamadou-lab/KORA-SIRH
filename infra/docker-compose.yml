# Environnement de développement local KORA (Blueprint §11.3)
# Usage : docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
      - kora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Stockage objet S3-compatible pour la GED (documents chiffrés) — incréments suivants.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kora_dev
      MINIO_ROOT_PASSWORD: kora_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kora_minio:/data

  # Bac à sable SMTP pour le Notification Engine — incréments suivants.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  kora_pgdata:
  kora_minio:
