# CI KORA — cinq jobs :
#   db-socle : migrations + seed + tests SQL (psql pur) + artefacts d'exécution
#   core     : domaine pur @kora/core (node:test, zéro dépendance)
#   api      : build NestJS/Prisma + e2e contre PostgreSQL réel
#   web      : build PWA (zéro dépendance, lockfile intact) + tests + intégration réelle
#   browser  : parcours Playwright réels (cookie HttpOnly, CSRF, PWA, hors-ligne, stockages)
# Validée sur GitHub le 01/08/2026 (job db-socle, run vert + artefacts) ; les jobs core
# et api sont ajoutés par l'incrément 2 — le sandbox de développement n'ayant pas accès
# au registre npm, cette CI est leur banc de preuve (ADR-003).
name: CI
on:
  push:
  pull_request:

defaults:
  run:
    shell: bash   # bash -eo pipefail : un échec sous tee reste un échec

jobs:
  db-socle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://kora_migrator:kora_migrator_dev@127.0.0.1:5432/kora
      DATABASE_URL_APP: postgres://kora_app:kora_app_dev@127.0.0.1:5432/kora
      DATABASE_URL_SUPER: postgres://postgres:postgres@127.0.0.1:5432/kora
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - name: Préparer le dossier d'artefacts
        run: mkdir -p ci-artifacts

      - name: Créer les rôles et la base (environnement vierge)
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kora_migrator LOGIN PASSWORD 'kora_migrator_dev'" \
            -c "CREATE ROLE kora_app LOGIN PASSWORD 'kora_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE kora OWNER kora_migrator" \
            2>&1 | tee ci-artifacts/00-provisionnement.log

      - name: Migrations (premier passage)
        run: bash infra/db/migrate.sh 2>&1 | tee ci-artifacts/01-migrations.log

      - name: Migrations (rejeu — idempotence du ledger)
        run: bash infra/db/migrate.sh 2>&1 | tee ci-artifacts/02-migrations-rejeu.log

      - name: Seed (sans intervention manuelle)
        run: bash infra/db/seed.sh 2>&1 | tee ci-artifacts/03-seed.log

      - name: Tests du socle (RLS, contraintes, audit, paramètres, falsification, sessions)
        run: bash infra/db/tests/run_tests.sh 2>&1 | tee ci-artifacts/04-tests.log

      - name: Métadonnées d'exécution (toujours générées)
        if: always()
        run: |
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME:-}"
            echo "run_id=${GITHUB_RUN_ID:-}"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "psql_client=$(psql --version)"
            echo "postgresql_server=$(psql "$DATABASE_URL_SUPER" -tAc 'SELECT version()' 2>/dev/null || echo 'indisponible')"
            psql "$DATABASE_URL_MIGRATOR" -tAc "SELECT 'parametres_legaux_draft_seed=' || count(*) FROM compliance.legal_parameters WHERE status = 'draft' AND key NOT LIKE 'test.%'" 2>/dev/null || true
          } > ci-artifacts/run-metadata.txt
          psql "$DATABASE_URL_MIGRATOR" -c 'TABLE meta.schema_migrations' \
            > ci-artifacts/migrations-ledger.txt 2>&1 || true

      - name: Publier les artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kora-ci-artefacts-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Type stripping natif requis (revue sponsor n° 2) : ≥ 22.18, jamais un 22.x flottant.
          node-version: '>=22.18 <23'
      - name: Tests du domaine pur (@kora/core — zéro dépendance)
        run: cd packages/core && node --test src/*.test.ts

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://kora_migrator:kora_migrator_dev@127.0.0.1:5432/kora
      DATABASE_URL_APP: postgres://kora_app:kora_app_dev@127.0.0.1:5432/kora
      PGPASSWORD: postgres
      # Clé MFA de TEST (AES-256-GCM) — jamais une clé de production.
      KORA_MFA_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.18 <23'

      - name: Créer les rôles et la base
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kora_migrator LOGIN PASSWORD 'kora_migrator_dev'" \
            -c "CREATE ROLE kora_app LOGIN PASSWORD 'kora_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE kora OWNER kora_migrator"

      - name: Migrations
        run: bash infra/db/migrate.sh

      - name: Dépendances (npm ci strict — lockfile committé requis)
        # Revue sponsor : builds reproductibles uniquement. Pas de npm install, pas de
        # bootstrap, pas d'écriture sur main depuis la CI. Le lockfile se génère hors CI
        # (npm install --package-lock-only à la racine, ou workflow manuel « lockfile »
        # qui le publie en artefact à committer soi-même).
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json absent — le générer et le committer avant la CI (voir README)"
            exit 1
          fi
          npm ci --no-audit --no-fund

      - name: Client Prisma
        run: cd apps/api && npx prisma generate

      - name: Build TypeScript strict
        run: |
          cd apps/api
          npx tsc -p tsconfig.json
          test -d dist || { echo '::error::tsc n a rien émis (dist absent)'; exit 1; }
          echo '--- arborescence émise (contrôle) ---'
          find dist -type f -name '*.js' | sort

      - name: E2E auth (login, sessions, verrouillage atomique, désactivation, audit)
        # Auto-localisant : exécute le test e2e compilé où que tsc l ait émis — les
        # imports relatifs internes au build restent valides quelle que soit la racine.
        run: |
          cd apps/api
          TESTS="$(find dist -type f -name '*.e2e.test.js')"
          if [ -z "$TESTS" ]; then
            echo '::error::aucun *.e2e.test.js émis sous dist/ — voir l arborescence du build'
            exit 1
          fi
          echo "tests exécutés : $TESTS"
          node --test $TESTS

  web:
    # PWA KORA (E7) — AUCUNE dépendance nouvelle : apps/web est hors workspaces npm
    # (pas de package.json de paquet), le lockfile racine reste inchangé ; le build est
    # tsc + node pur. Le job compile l'API pour exécuter l'intégration RÉELLE
    # frontend ↔ API (connexion, MFA TOTP, permissions, révocation immédiate).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://kora_migrator:kora_migrator_dev@127.0.0.1:5432/kora
      DATABASE_URL_APP: postgres://kora_app:kora_app_dev@127.0.0.1:5432/kora
      PGPASSWORD: postgres
      KORA_MFA_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.18 <23'

      - name: Créer les rôles et la base
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kora_migrator LOGIN PASSWORD 'kora_migrator_dev'" \
            -c "CREATE ROLE kora_app LOGIN PASSWORD 'kora_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE kora OWNER kora_migrator"

      - name: Migrations
        run: bash infra/db/migrate.sh

      - name: Dépendances (npm ci strict — lockfile INCHANGÉ par E7)
        run: npm ci --no-audit --no-fund

      - name: Client Prisma + build API (nécessaire à l'intégration réelle)
        run: |
          cd apps/api
          npx prisma generate
          npx tsc -p tsconfig.json

      - name: Build PWA (tsc strict + coquille + icônes + service worker assemblé)
        run: node apps/web/scripts/build.mjs

      - name: Tests web (lint maison, i18n FR/EN, contrat OpenAPI, cache, a11y, client, intégration réelle)
        run: |
          cd apps/web
          node --test test/*.test.ts

      - name: Artefact PWA (coquille construite, preuve d'installabilité)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kora-pwa-dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error

  browser:
    # Tests NAVIGATEUR réels (clôture Phase 1) — Playwright ÉPINGLÉ, installé job-local
    # (npm i --no-save : le lockfile racine reste INCHANGÉ ; l'entrée lockfile arrivera
    # avec la prochaine vague de dépendances). Chaîne complète : serve.mjs (en-têtes de
    # production + proxy même origine) → API compilée → PostgreSQL migré.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://kora_migrator:kora_migrator_dev@127.0.0.1:5432/kora
      DATABASE_URL_APP: postgres://kora_app:kora_app_dev@127.0.0.1:5432/kora
      PGPASSWORD: postgres
      KORA_MFA_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
      PLAYWRIGHT_VERSION: 1.56.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.18 <23'

      - name: Créer les rôles et la base
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE kora_migrator LOGIN PASSWORD 'kora_migrator_dev'" \
            -c "CREATE ROLE kora_app LOGIN PASSWORD 'kora_app_dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE kora OWNER kora_migrator"

      - name: Migrations
        run: bash infra/db/migrate.sh

      - name: Dépendances (npm ci strict — lockfile INCHANGÉ)
        run: npm ci --no-audit --no-fund

      - name: Client Prisma + build API
        run: |
          cd apps/api
          npx prisma generate
          npx tsc -p tsconfig.json

      - name: Build PWA
        run: node apps/web/scripts/build.mjs

      - name: Cache navigateur Playwright
        # v5 (runtime Node.js 24) : supprime l'avertissement « forcé sur node24 »
        # relevé par la revue sponsor E11.2 sur actions/cache@v4 (runtime node20).
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Playwright épinglé (job-local, hors lockfile) + Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Parcours navigateur (desktop + mobile, PWA, hors-ligne, stockages, en-têtes)
        run: node --test apps/web/test-browser/*.e2e.test.mjs

      - name: Captures d'échec (UNIQUEMENT si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kora-browser-echecs-${{ github.sha }}
          path: apps/web/test-results/
          if-no-files-found: ignore
